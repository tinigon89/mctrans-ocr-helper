# Mirror koharu's build-time env (koharu's own .cargo/config.toml doesn't apply
# when we consume it as a git dependency).
#
# LLAMA_CPP_TAG is only baked in as a string constant (env!) — llama.cpp itself
# is downloaded prebuilt at RUNTIME and only if the LLM path is used, which this
# OCR/inpaint helper never touches. So setting the tag is enough to compile.
[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }
LLAMA_CPP_TAG = "b8935"
# Only relevant for `--features cuda` builds:
NVCC_PREPEND_FLAGS = "-std=c++17"
# Ampere (compute 8.0) — the lowest card the candle models run on in GPU mode.
# candle emits PTX for this arch and the driver JIT-compiles it up to the running
# GPU, so ONE binary runs on Ampere through Blackwell (3060 → 4090 → 50xx).
#
# Not 75: candle compiles its bf16 kernels only for 8.0+, the models call them, and
# an sm_75 build fails on EVERY card with "named symbol not found" (measured
# 2026-11-23). Turing and older run the candle models on the CPU instead —
# candle_needs_cpu() in main.rs — while llama.cpp OCR keeps their GPU.
# Not the build box's own cap either (89 / Ada): 0.1.14 and 0.1.15 shipped sm_89
# kernels from a stale cache and failed on every pre-Ada card with
# "CUDA_ERROR_INVALID_PTX". Cargo does NOT rebuild candle-kernels when this value
# changes: run `cargo clean -p candle-kernels --release`; package.bat checks it.
CUDA_COMPUTE_CAP = "80"
